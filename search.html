<!DOCTYPE html><html><head><title>Podcast Search</title><style>#results{margin-top:20px}</style></head><body><h1>Podcast Search</h1><input type="text" id="keywordInput" placeholder="Enter a keyword"> <button id="searchButton">Search</button><ol id="results"></ol><script>async function searchPodcasts(e){const t=`https://itunes.apple.com/search?media=podcast&term=${encodeURIComponent(e)}`;try{const e=await fetch(t),n=await e.json();return n.results.map(e=>({feedUrl:e.feedUrl,title:e.collectionName,image:e.artworkUrl100}))}catch(e){return console.log("Error searching podcasts:",e),[]}}document.getElementById("searchButton").addEventListener("click",async function(){const e=document.getElementById("keywordInput").value,t=document.getElementById("results");if(t.innerHTML="",""===e.trim())return;(await searchPodcasts(e)).forEach(e=>{const n=document.createElement("li"),c=document.createElement("h3");c.textContent=e.title;const a=document.createElement("img");a.src=e.image,a.alt=e.title;const o=document.createElement("a");o.href=e.feedUrl,o.textContent="Go to feed",n.appendChild(c),n.appendChild(a),n.appendChild(o),t.appendChild(n)})})</script></body></html>
